[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-research-infrastructure"
version = "0.1.0"
description = "Shared research infrastructure for reproducible ML experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.3,<1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["PLE1205"]